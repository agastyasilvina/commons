<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <style>
    @page {
      size: A4;
      margin: 32mm 15mm 25mm 15mm;          /* top/bottom leave room for the header/footer images */
      @top-center    { content: element(header); }
      @bottom-center { content: element(footer); }
    }
    .header  { position: running(header); width: 180mm; }   /* 180mm = A4 width minus side margins */
    .footer  { position: running(footer); width: 180mm; }
    body     { font-family: sans-serif; font-size: 10pt; }
    h1       { font-size: 14pt; margin: 0 0 4pt 0; }
    h2       { font-size: 11pt; margin: 12pt 0 4pt 0; page-break-after: avoid; }   /* form name */
    .row     { clear: both; margin-bottom: 3pt; page-break-inside: avoid; }
    .tag     { float: left; width: 55mm; }
    .sep     { float: left; width: 5mm; }
    .val     { margin-left: 60mm; }
    .picture { display: block; width: 160px; height: 90px; }   /* always 160x90 (about 42 x 24 mm on paper) */
  </style>
</head>
<body>

<!--/* Header/footer images, repeated on every page. Keep them before the content. */-->
<img class="header" src="images/header.png" alt=""/>
<img class="footer" src="images/footer.png" alt=""/>

<h1 th:if="${title != null}" th:text="${title}">Form Summary</h1>

<!--/* One block per form: its name, then its fields as "Field : value". Pictures show as images. */-->
<div class="form" th:each="form : ${forms}" th:unless="${form.value.isEmpty()}">
  <h2 th:unless="${form.key.isEmpty()}" th:text="${form.key}">Identitas Nasabah</h2>
  <div class="row" th:each="f : ${form.value}" th:with="src=${values.srcOf(f.value)}">
    <div class="tag" th:text="${f.key}">Nama Lengkap</div>
    <div class="sep">:</div>
    <div class="val" th:if="${src == null}" th:text="${values.textOf(f.value)}">Selkie</div>
    <div class="val" th:if="${src != null}"><img class="picture" th:src="${src}" alt=""/></div>
  </div>
</div>

</body>
</html>
